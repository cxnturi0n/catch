name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catch
          POSTGRES_PASSWORD: catch
          POSTGRES_DB: catch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catch -d catch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://catch:catch@localhost:5432/catch
      APP_URL: http://localhost:5173
      API_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CREDENTIALS_ENCRYPTION_KEYS: k1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      STORAGE_LOCAL_ROOT: /tmp/catch-storage
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install -g npm@11 # lockfiles are written by npm 11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11 # lockfiles are written by npm 11
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catch
          POSTGRES_PASSWORD: catch
          POSTGRES_DB: catch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catch -d catch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://catch:catch@localhost:5432/catch
      APP_URL: http://localhost:5173
      API_URL: http://localhost:5173/api
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CREDENTIALS_ENCRYPTION_KEYS: k1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      STORAGE_LOCAL_ROOT: /tmp/catch-storage
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11 # lockfiles are written by npm 11
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run db:migrate
        working-directory: backend
      - name: Start API and SPA
        run: |
          (cd backend && nohup npm run dev:api > /tmp/api.log 2>&1 &)
          (cd frontend && nohup npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://localhost:5173/api/readyz && break; sleep 2; done
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Logs on failure
        if: failure()
        run: tail -50 /tmp/api.log /tmp/vite.log

  images:
    # Proves both Dockerfiles still build; images are not pushed (the server builds its own).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q backend
      - run: docker build -q frontend
