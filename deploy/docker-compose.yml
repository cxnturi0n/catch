# Catch — one application stack (production OR staging) on a host.
#   docker compose up -d
# Services: frontend (static SPA), api, worker, migrate (one-shot), db
# (PostgreSQL 16). Nothing publishes 80/443: the shared edge Caddy in
# docker-compose.edge.yml (bring it up first) reaches this stack on the
# external `catch-edge` network as ${STACK}-api / ${STACK}-frontend.
# STACK (catch | catch-staging), APP_ENV and DB_PORT come from .env.
name: ${STACK:-catch}

x-backend: &backend
  build:
    context: ../backend
  image: ${STACK:-catch}-backend:${IMAGE_TAG:-local}
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    APP_ENV: ${APP_ENV:-production}
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /api
        VITE_APP_ENV: ${APP_ENV:-production}
    image: ${STACK:-catch}-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      default:
      edge:
        aliases: ["${STACK:-catch}-frontend"]

  api:
    <<: *backend
    command: ["node", "dist/api.js"]
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_LOCAL_ROOT: /data/storage
    volumes:
      - storage:/data/storage
    networks:
      default:
      edge:
        aliases: ["${STACK:-catch}-api"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]

  migrate:
    build:
      context: ../backend
    image: ${STACK:-catch}-backend:${IMAGE_TAG:-local}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only (local dev + psql on the server). Staging uses another DB_PORT.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 256mb

networks:
  edge:
    external: true
    name: catch-edge

volumes:
  pgdata:
  storage:
