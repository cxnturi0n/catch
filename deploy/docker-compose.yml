# Catch — full stack on one host.
#   docker compose --env-file .env up -d
# Services: edge (Caddy, TLS), frontend (static SPA), api, worker, migrate
# (one-shot), db (PostgreSQL 16). Only `edge` publishes ports.
name: catch

x-backend: &backend
  build:
    context: ../backend
  image: catch-backend:${IMAGE_TAG:-local}
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /api
    image: catch-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped

  api:
    <<: *backend
    command: ["node", "dist/api.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]

  migrate:
    build:
      context: ../backend
    image: catch-backend:${IMAGE_TAG:-local}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published only for local development; remove or bind to 127.0.0.1 on the server.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 256mb

volumes:
  pgdata:
  caddy_data:
  caddy_config:
